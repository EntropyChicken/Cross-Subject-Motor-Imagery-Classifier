name: ntab-bci

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # Core scientific Python
  - numpy=1.26.3
  - scipy=1.12.0
  - pandas=1.5.3

  # Notebook environment
  - jupyter=1.0.0
  - ipykernel
  - pooch=1.8.0

  # ML and visualization
  - scikit-learn=1.4.0
  - matplotlib=3.8.2
  - seaborn=0.12.2

  # Install packages whose exact PyPI releases are required.
  - pip:
      - mne==1.6.1
      - pyriemann==0.5
      - moabb==1.0.0
      - braindecode==0.8.1